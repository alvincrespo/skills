project_name: mdlinkcheck
one_line_description: >-
  Check a folder of Markdown docs for broken links, locally or as a GitHub
  Action.
objective: >-
  A Python CLI, `mdlinkcheck [PATH]`, that finds every link in the Markdown
  files under PATH, verifies that relative file links and heading anchors
  resolve, optionally checks external URLs, and reports each broken link as
  file:line with a reason — exiting nonzero when anything is broken so it
  can gate CI. Configurable through a `.mdlinkcheck.toml` file, installable
  from PyPI, and usable as a GitHub Action. Done means it has been run in
  CI against two real, unrelated documentation repos with every reported
  link confirmed broken by hand and no false positives left after
  configuration.
in_scope:
  - "Link extraction: inline links, images, reference-style links, and autolinks, with source line numbers"
  - "Internal checks: relative and root-absolute file links, and heading anchors using GitHub's slug rules"
  - "External checks: HTTP status checks with timeouts, retries, deduplication, and bounded concurrency"
  - "Configuration via .mdlinkcheck.toml, overridable by CLI flags"
  - "CLI output as text or JSON, with exit codes suitable for CI and GitHub annotations"
  - "Distribution as a PyPI package and a composite GitHub Action"
out_of_scope:
  - "Automatically fixing or rewriting broken links"
  - "Non-Markdown formats (reStructuredText, AsciiDoc, HTML)"
  - "Crawling a rendered or deployed docs site"
  - "Caching external-check results between runs"
  - "A web UI or hosted service"
known_pieces:
  - "markdown-it-py for parsing (CommonMark-compliant, exposes source line maps on tokens)"
  - "httpx for HTTP, using AsyncClient for concurrency and MockTransport for tests"
  - "Python 3.11+, so tomllib is in the standard library"
  - "GitHub's heading-anchor slug algorithm is the one to match, since most target docs are read on GitHub"
repo:
  visibility: public
  license: MIT
target_milestone_name: "v0.1 — First usable release"
